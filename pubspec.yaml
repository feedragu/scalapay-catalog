name: scalapay_catalog
description: Scalapay product catalog — Flutter take-home assessment.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.3
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  provider: ^6.1.5+1
  retrofit: ^4.10.0
  shimmer: ^3.0.0
  stream_transform: ^2.1.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  dart_code_linter: ^4.3.0
  file: ^7.0.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9
  vector_graphics: ^1.2.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.dev
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
